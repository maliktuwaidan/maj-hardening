# Drop-in: /etc/nginx/conf.d/galasin.conf
#
# Cloudflare-fronted origin. TLS terminates at Cloudflare; this box serves :80.
#
# NOTE: Real client IP extraction (real_ip_header / set_real_ip_from for
# Cloudflare CIDRs) is intentionally NOT in this file. Manage it separately
# (e.g. /etc/nginx/conf.d/cloudflare-realip.conf refreshed by cron from
# https://www.cloudflare.com/ips-v4 and ips-v6). Without it, $remote_addr is
# the Cloudflare edge IP, not the real client.

server {
    listen 80;
    server_name service.galasin.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
