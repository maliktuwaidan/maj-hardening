# Shared install/deploy config — sourced by bootstrap.sh and deploy.sh.
# No secrets here. Real secrets live in /etc/galasin/galasin.env (see galasin.env.example).

# --- app identity ----
APP_NAME="galasin_services"            # must match `app:` in mix.exs
APP_DOMAIN="service.galasin.com"       # public hostname (matches Cloudflare)

# --- users & paths ----
SVC_USER="galasin-svc"                 # dedicated service user (non-login)
SVC_HOME="/opt/galasin"                # service user home
SOURCE_DIR="/home/galasin/galasin-services"   # where you edit (workflow B)
DEPLOY_DIR="${SVC_HOME}/galasin-services"     # where the app runs from
ENV_FILE="/etc/galasin/galasin.env"           # secrets, 600 owned by SVC_USER

# Release binary (built by deploy.sh)
RELEASE_BIN="${DEPLOY_DIR}/_build/prod/rel/${APP_NAME}/bin/${APP_NAME}"

# --- toolchain versions (pin everything) ----
ASDF_VER="0.18.0"
ERLANG_VER="27.3.4"
ELIXIR_VER="1.18.4-otp-27"

# --- networking ----
APP_PORT="4000"                        # internal bind, nginx proxies to this
